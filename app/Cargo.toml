[package]
name = "app"
version = "0.1.2"
edition = "2024"

[[bin]]
name = "Gridvana"
path = "src/main.rs"

[package.metadata.bundle]
name = "Gridvana"
identifier = "com.gridvana.app"
icon = ["app/assets/logo.png", "assets/logo.png"]
category = "Graphics and Design"
short_description = "A grid-based pixel art and animation editor"

[dependencies]
dirs = "6.0.0"
gridvana_core = { version = "0.1.0", path = "../core" }
gridvana_mcp = { version = "0.1.0", path = "../mcp" }
iced = { version = "^0.14", features = ["canvas", "tokio", "image", "svg", "debug"] }
iced_term = { path = "../vendor/iced_term" }
rfd = "0.15.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.8.2"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.15.3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61.3"
features = [
    "Win32_System_Com",
    "Win32_UI_Shell",
]
