name: Release macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Install cargo-bundle
        run: cargo install cargo-bundle --locked

      - name: Test
        run: cargo test --workspace

      - name: Bundle app
        run: cargo bundle --release --package app --format osx

      - name: Sign app (ad-hoc)
        run: codesign --force --deep --sign - target/release/bundle/osx/Gridvana.app

      - name: Create archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            target/release/bundle/osx/Gridvana.app \
            "Gridvana-${{ github.ref_name }}-macos-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Gridvana-macos-${{ matrix.arch }}
          path: Gridvana-${{ github.ref_name }}-macos-${{ matrix.arch }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
